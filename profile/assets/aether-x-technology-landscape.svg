<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">AETHER X Technology Landscape</title>
  <desc id="desc">A layered view of AETHER X technology from data and knowledge through models, agents, governance, verification and products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
    <linearGradient id="layer1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E7490"/><stop offset="1" stop-color="#155E75"/></linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1D4ED8"/><stop offset="1" stop-color="#3730A3"/></linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6D28D9"/><stop offset="1" stop-color="#7E22CE"/></linearGradient>
    <linearGradient id="layer4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F766E"/><stop offset="1" stop-color="#115E59"/></linearGradient>
    <linearGradient id="layer5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#1E293B"/></linearGradient>
  </defs>
  <rect width="1600" height="700" rx="32" fill="url(#bg)"/>
  <rect x="24" y="24" width="1552" height="652" rx="26" fill="none" stroke="#263244" stroke-width="2"/>
  <text x="80" y="88" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700">AETHER X Technology Landscape</text>
  <text x="80" y="128" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">A shared governed intelligence layer beneath specialized products and institutional workflows.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="180" y="180" width="1240" height="82" rx="20" fill="url(#layer1)"/>
    <text x="220" y="214" fill="#ECFEFF" font-size="22" font-weight="800">PRODUCTS &amp; DOMAIN SYSTEMS</text>
    <text x="220" y="244" fill="#CFFAFE" font-size="18">Financial intelligence • Research environments • Knowledge systems • Enterprise workflows</text>

    <rect x="230" y="280" width="1140" height="82" rx="20" fill="url(#layer2)"/>
    <text x="270" y="314" fill="#EFF6FF" font-size="22" font-weight="800">SPECIALIZED AGENTS &amp; MULTI-MODEL INTELLIGENCE</text>
    <text x="270" y="344" fill="#DBEAFE" font-size="18">Model routing • Domain agents • Structured analysis • Provider independence • Bounded tools</text>

    <rect x="280" y="380" width="1040" height="82" rx="20" fill="url(#layer3)"/>
    <text x="320" y="414" fill="#FAF5FF" font-size="22" font-weight="800">GOVERNANCE, AUTHORITY &amp; SECURITY</text>
    <text x="320" y="444" fill="#F3E8FF" font-size="18">Permissions • Policy • Approvals • Least privilege • Data boundaries • Revocation</text>

    <rect x="330" y="480" width="940" height="82" rx="20" fill="url(#layer4)"/>
    <text x="370" y="514" fill="#F0FDFA" font-size="22" font-weight="800">EVIDENCE, VERIFICATION &amp; AUDIT</text>
    <text x="370" y="544" fill="#CCFBF1" font-size="18">Provenance • Acceptance evidence • Independent verification • Audit trail • Recovery</text>

    <rect x="380" y="580" width="840" height="62" rx="18" fill="url(#layer5)"/>
    <text x="420" y="618" fill="#E2E8F0" font-size="21" font-weight="800">DATA • KNOWLEDGE • STATE • INSTITUTIONAL MEMORY</text>
  </g>

  <g stroke="#64748B" stroke-width="2" stroke-dasharray="6 8" opacity="0.75">
    <line x1="800" y1="262" x2="800" y2="280"/><line x1="800" y1="362" x2="800" y2="380"/><line x1="800" y1="462" x2="800" y2="480"/><line x1="800" y1="562" x2="800" y2="580"/>
  </g>

  <text x="80" y="662" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Shared principle: models are replaceable; authority, evidence, state and institutional knowledge remain governed system assets.</text>
</svg>