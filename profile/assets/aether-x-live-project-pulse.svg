    .boundaryEnd{font:600 9.5px Inter,Segoe UI,Arial,sans-serif;fill:#9B8A70;text-anchor:end}
    .footer{font:600 12px Inter,Segoe UI,Arial,sans-serif;fill:#8E9BAD}
