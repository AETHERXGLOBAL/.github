<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">AETHER X Intelligence Chain</title>
  <desc id="desc">The canonical AETHER X company-level operating chain from intent through data and knowledge, evidence, analysis and reasoning, decision, authority, controlled execution, verification, verified outcome, and audit and learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010D1D"/>
      <stop offset="0.58" stop-color="#071426"/>
      <stop offset="1" stop-color="#0B1A2C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9D753C"/>
      <stop offset="0.5" stop-color="#DEB459"/>
      <stop offset="1" stop-color="#9D753C"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="760" rx="30" fill="url(#bg)"/>
  <rect x="24" y="24" width="1552" height="712" rx="24" fill="none" stroke="#243247" stroke-width="1.5"/>

  <text x="80" y="92" fill="#F4F4F3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800">AETHER X Intelligence Chain</text>
  <text x="80" y="130" fill="#AAB3BD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Canonical company-level operating chain. Individual projects implement only the stages appropriate to their scope and risk.</text>
  <rect x="80" y="154" width="220" height="4" rx="2" fill="url(#gold)"/>

  <!-- Top row: 1 → 5 -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(170 270)">
      <rect x="-120" y="-58" width="240" height="116" rx="20" fill="#0F1A2A" stroke="#9D753C" stroke-width="2"/>
      <text y="-12" fill="#DEB459" font-size="14" font-weight="800">01</text>
      <text y="22" fill="#F4F4F3" font-size="22" font-weight="800">INTENT</text>
    </g>
    <g transform="translate(485 270)">
      <rect x="-130" y="-58" width="260" height="116" rx="20" fill="#0F1A2A" stroke="#9D753C" stroke-width="2"/>
      <text y="-14" fill="#DEB459" font-size="14" font-weight="800">02</text>
      <text y="14" fill="#F4F4F3" font-size="19" font-weight="800">DATA / KNOWLEDGE</text>
    </g>
    <g transform="translate(800 270)">
      <rect x="-120" y="-58" width="240" height="116" rx="20" fill="#0F1A2A" stroke="#DEB459" stroke-width="2.2"/>
      <text y="-12" fill="#DEB459" font-size="14" font-weight="800">03</text>
      <text y="22" fill="#F4F4F3" font-size="22" font-weight="800">EVIDENCE</text>
    </g>
    <g transform="translate(1115 270)">
      <rect x="-135" y="-58" width="270" height="116" rx="20" fill="#0F1A2A" stroke="#DEB459" stroke-width="2.2"/>
      <text y="-14" fill="#DEB459" font-size="14" font-weight="800">04</text>
      <text y="10" fill="#F4F4F3" font-size="18" font-weight="800">ANALYSIS /</text>
      <text y="34" fill="#F4F4F3" font-size="18" font-weight="800">REASONING</text>
    </g>
    <g transform="translate(1430 270)">
      <rect x="-120" y="-58" width="240" height="116" rx="20" fill="#0F1A2A" stroke="#DEB459" stroke-width="2.2"/>
      <text y="-12" fill="#DEB459" font-size="14" font-weight="800">05</text>
      <text y="22" fill="#F4F4F3" font-size="22" font-weight="800">DECISION</text>
    </g>
  </g>

  <!-- Top arrows -->
  <g stroke="#DEB459" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M290 270H345"/><path d="M337 262l8 8-8 8"/>
    <path d="M615 270H670"/><path d="M662 262l8 8-8 8"/>
    <path d="M920 270H970"/><path d="M962 262l8 8-8 8"/>
    <path d="M1250 270H1300"/><path d="M1292 262l8 8-8 8"/>
  </g>

  <!-- Decision to authority -->
  <path d="M1430 328V430" stroke="#DEB459" stroke-width="3" fill="none"/>
  <path d="M1422 422l8 8 8-8" stroke="#DEB459" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom row: 6 → 10, flowing right to left -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(1430 520)">
      <rect x="-120" y="-58" width="240" height="116" rx="20" fill="#0F1A2A" stroke="#DEB459" stroke-width="2.2"/>
      <text y="-12" fill="#DEB459" font-size="14" font-weight="800">06</text>
      <text y="22" fill="#F4F4F3" font-size="22" font-weight="800">AUTHORITY</text>
    </g>
    <g transform="translate(1115 520)">
      <rect x="-135" y="-58" width="270" height="116" rx="20" fill="#0F1A2A" stroke="#DEB459" stroke-width="2.2"/>
      <text y="-14" fill="#DEB459" font-size="14" font-weight="800">07</text>
      <text y="10" fill="#F4F4F3" font-size="18" font-weight="800">CONTROLLED</text>
      <text y="34" fill="#F4F4F3" font-size="18" font-weight="800">EXECUTION</text>
    </g>
    <g transform="translate(800 520)">
      <rect x="-120" y="-58" width="240" height="116" rx="20" fill="#0F1A2A" stroke="#DEB459" stroke-width="2.2"/>
      <text y="-12" fill="#DEB459" font-size="14" font-weight="800">08</text>
      <text y="22" fill="#F4F4F3" font-size="21" font-weight="800">VERIFICATION</text>
    </g>
    <g transform="translate(485 520)">
      <rect x="-130" y="-58" width="260" height="116" rx="20" fill="#0F1A2A" stroke="#DEB459" stroke-width="2.2"/>
      <text y="-14" fill="#DEB459" font-size="14" font-weight="800">09</text>
      <text y="10" fill="#F4F4F3" font-size="18" font-weight="800">VERIFIED</text>
      <text y="34" fill="#F4F4F3" font-size="18" font-weight="800">OUTCOME</text>
    </g>
    <g transform="translate(170 520)">
      <rect x="-120" y="-58" width="240" height="116" rx="20" fill="#0F1A2A" stroke="#9D753C" stroke-width="2"/>
      <text y="-14" fill="#DEB459" font-size="14" font-weight="800">10</text>
      <text y="10" fill="#F4F4F3" font-size="18" font-weight="800">AUDIT /</text>
      <text y="34" fill="#F4F4F3" font-size="18" font-weight="800">LEARNING</text>
    </g>
  </g>

  <!-- Bottom arrows: right to left -->
  <g stroke="#DEB459" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1310 520H1260"/><path d="M1268 512l-8 8 8 8"/>
    <path d="M980 520H920"/><path d="M928 512l-8 8 8 8"/>
    <path d="M680 520H615"/><path d="M623 512l-8 8 8 8"/>
    <path d="M355 520H290"/><path d="M298 512l-8 8 8 8"/>
  </g>

  <rect x="80" y="650" width="1440" height="64" rx="16" fill="#0B1626" stroke="#243247"/>
  <text x="800" y="690" text-anchor="middle" fill="#AAB3BD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">CAPABILITY ≠ AUTHORITY   •   EXECUTION COMPLETE ≠ VERIFIED   •   VERIFIED OUTCOME FEEDS AUDIT / LEARNING</text>
</svg>
