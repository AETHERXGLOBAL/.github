<path d="M786 560l9 9 19-22" fill="none" stroke="#d7b56e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="800" y="602" text-anchor="middle" class="principle">VERIFICATION</text>
<text x="800" y="620" text-anchor="middle" class="principleSub">Independent checks</text>

