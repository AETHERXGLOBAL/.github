<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">AETHER X GLOBAL Portfolio Architecture</title>
<desc id="desc">Portfolio overview for AETHER X Quantum, AX-OS, AETHER Intelligence Core and AMII Research Lab. Connections show portfolio membership and shared doctrine only, not technical integration.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/>
    <stop offset="0.55" stop-color="#0b1424"/>
    <stop offset="1" stop-color="#050b14"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111d2f"/>
    <stop offset="1" stop-color="#0b1422"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9f7935"/>
    <stop offset="0.5" stop-color="#d7b56e"/>
    <stop offset="1" stop-color="#9f7935"/>
  </linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#8fa0b5" stroke-opacity="0.045"/>
  </pattern>
  <style>
    .brand{font:700 20px Inter,Segoe UI,Arial,sans-serif;letter-spacing:5px;fill:#d7b56e}
    .title{font:700 32px Inter,Segoe UI,Arial,sans-serif;fill:#f4f7fb}
    .subtitle{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#aeb9c8}
    .cardTitle{font:700 25px Inter,Segoe UI,Arial,sans-serif;fill:#f6f8fb}
    .domain{font:600 14px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.15px;fill:#c9a86a}
    .body{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#b8c2cf}
    .small{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#93a1b3}
    .role{font:600 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.5px;fill:#d4dce7}
    .pill{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.7px;fill:#f1d79a}
    .pillBlue{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.7px;fill:#d9e9ff}
    .pillPurple{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.7px;fill:#e6cff8}
    .principle{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1px;fill:#e7edf5}
    .principleSub{font:400 11px Inter,Segoe UI,Arial,sans-serif;fill:#8493a6}
  </style>
</defs>
<rect width="1600" height="980" fill="url(#bg)"/>
<rect width="1600" height="980" fill="url(#grid)"/>
<circle cx="800" cy="500" r="380" fill="none" stroke="#c9a86a" stroke-opacity="0.055"/>
<circle cx="800" cy="500" r="315" fill="none" stroke="#c9a86a" stroke-opacity="0.04"/>

<!-- Header: vector/text only for GitHub compatibility -->
<text x="800" y="62" text-anchor="middle" class="brand">AETHER X GLOBAL</text>
<text x="800" y="112" text-anchor="middle" class="title">GOVERNED INTELLIGENCE SYSTEMS</text>
<text x="800" y="145" text-anchor="middle" class="subtitle">Four initiatives. Distinct missions. Shared doctrine. Explicit maturity.</text>
<rect x="650" y="170" width="300" height="2" fill="url(#gold)"/>
<circle cx="800" cy="198" r="6" fill="#d7b56e"/>

<!-- Portfolio membership connectors -->
<path d="M800 198V240 M800 240H380V300 M800 240H1220V300 M800 240V650 M380 560V620 M1220 560V620" fill="none" stroke="#a68142" stroke-width="2" stroke-opacity="0.75"/>
<circle cx="380" cy="300" r="5" fill="#d7b56e"/>
<circle cx="1220" cy="300" r="5" fill="#d7b56e"/>
<circle cx="380" cy="620" r="5" fill="#d7b56e"/>
<circle cx="1220" cy="620" r="5" fill="#d7b56e"/>

<!-- Shared doctrine spine -->
<rect x="715" y="254" width="170" height="610" rx="28" fill="#0d1726" stroke="#7d6335" stroke-width="1.5"/>
<text x="800" y="286" text-anchor="middle" class="domain">SHARED DOCTRINE</text>
<line x1="800" y1="318" x2="800" y2="810" stroke="#725b36" stroke-width="1"/>

<!-- Evidence -->
<circle cx="800" cy="370" r="28" fill="#101b2b" stroke="#d7b56e" stroke-width="2"/>
<path d="M786 370l9 9 19-22" fill="none" stroke="#d7b56e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="800" y="414" text-anchor="middle" class="principle">EVIDENCE</text>
<text x="800" y="433" text-anchor="middle" class="principleSub">Traceable basis</text>

<!-- Authority -->
<circle cx="800" cy="493" r="28" fill="#101b2b" stroke="#d7b56e" stroke-width="2"/>
<path d="M782 503h36M786 503v-21h28v21M781 481l19-14 19 14" fill="none" stroke="#d7b56e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="800" y="537" text-anchor="middle" class="principle">AUTHORITY</text>
<text x="800" y="556" text-anchor="middle" class="principleSub">Bounded rights</text>

<!-- Verification -->
<circle cx="800" cy="616" r="28" fill="#101b2b" stroke="#d7b56e" stroke-width="2"/>
<path d="M786 616l9 9 19-22" fill="none" stroke="#d7b56e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="800" y="660" text-anchor="middle" class="principle">VERIFICATION</text>
<text x="800" y="679" text-anchor="middle" class="principleSub">Independent checks</text>

<!-- Controlled action -->
<circle cx="800" cy="739" r="28" fill="#101b2b" stroke="#d7b56e" stroke-width="2"/>
<rect x="789" y="729" width="22" height="20" rx="2" fill="none" stroke="#d7b56e" stroke-width="2"/>
<path d="M793 724h14" stroke="#d7b56e" stroke-width="2"/>
<text x="800" y="783" text-anchor="middle" class="principle">CONTROLLED ACTION</text>
<text x="800" y="802" text-anchor="middle" class="principleSub">Accountable outcomes</text>

<!-- Quantum card -->
<rect x="70" y="300" width="610" height="260" rx="26" fill="url(#panel)" stroke="#b18d4c" stroke-width="1.8"/>
<rect x="95" y="328" width="125" height="3" fill="url(#gold)"/>
<text x="105" y="382" class="cardTitle">AETHER X QUANTUM</text>
<text x="105" y="420" class="domain">FINANCIAL STRATEGY INTELLIGENCE</text>
<rect x="105" y="446" width="230" height="34" rx="9" fill="#332814" stroke="#9f7935"/>
<text x="220" y="468" text-anchor="middle" class="pill">UNDER ACTIVE DEVELOPMENT</text>
<text x="105" y="520" class="body">Evidence-governed strategy engineering and controlled</text>
<text x="105" y="544" class="body">financial workflow intelligence.</text>
<text x="655" y="542" text-anchor="end" class="role">ROLE · RESEARCH / STRATEGY / WORKFLOW</text>

<!-- AX-OS card -->
<rect x="920" y="300" width="610" height="260" rx="26" fill="url(#panel)" stroke="#b18d4c" stroke-width="1.8"/>
<rect x="945" y="328" width="125" height="3" fill="url(#gold)"/>
<text x="955" y="382" class="cardTitle">AX-OS</text>
<text x="955" y="420" class="domain">GOVERNED AI OPERATIONS</text>
<rect x="955" y="446" width="288" height="34" rx="9" fill="#11243a" stroke="#4b75a8"/>
<text x="1099" y="468" text-anchor="middle" class="pillBlue">UNDER DEVELOPMENT · ACTIVE BUILD</text>
<text x="955" y="520" class="body">Internal-first cognitive and outcome operating system for</text>
<text x="955" y="544" class="body">authority, execution, verification and institutional learning.</text>
<text x="1505" y="542" text-anchor="end" class="role">ROLE · GOVERN / EXECUTE / VERIFY</text>

<!-- AIC card -->
<rect x="70" y="620" width="610" height="260" rx="26" fill="url(#panel)" stroke="#b18d4c" stroke-width="1.8"/>
<rect x="95" y="648" width="125" height="3" fill="url(#gold)"/>
<text x="105" y="702" class="cardTitle">AETHER INTELLIGENCE CORE · AIC</text>
<text x="105" y="740" class="domain">FINANCIAL INTELLIGENCE INFRASTRUCTURE</text>
<rect x="105" y="766" width="322" height="34" rx="9" fill="#332814" stroke="#9f7935"/>
<text x="266" y="788" text-anchor="middle" class="pill">APPROVED ARCHITECTURE · PRE-IMPLEMENTATION</text>
<text x="105" y="840" class="body">Temporal data, provenance, point-in-time correctness and</text>
<text x="105" y="864" class="body">reusable intelligence foundations. Implementation remains gated.</text>
<text x="655" y="862" text-anchor="end" class="role">ROLE · DATA / MEMORY / PROVENANCE</text>

<!-- AMII card -->
<rect x="920" y="620" width="610" height="260" rx="26" fill="url(#panel)" stroke="#b18d4c" stroke-width="1.8"/>
<rect x="945" y="648" width="125" height="3" fill="url(#gold)"/>
<text x="955" y="702" class="cardTitle">AMII RESEARCH LAB</text>
<text x="955" y="740" class="domain">QUANTITATIVE MARKET RESEARCH</text>
<rect x="955" y="766" width="300" height="34" rx="9" fill="#2a1c35" stroke="#80519b"/>
<text x="1105" y="788" text-anchor="middle" class="pillPurple">RESEARCH · CURRENT RESEARCH PHASE</text>
<text x="955" y="840" class="body">Methodology, validation and derived market-intelligence research.</text>
<text x="955" y="864" class="body">No empirical performance or production-readiness claim.</text>
<text x="1505" y="862" text-anchor="end" class="role">ROLE · RESEARCH / VALIDATE / LEARN</text>

<!-- Boundary -->
<line x1="70" y1="914" x2="1530" y2="914" stroke="#8c713e" stroke-width="1"/>
<text x="800" y="940" text-anchor="middle" class="small">PORTFOLIO MEMBERSHIP ONLY · NO TECHNICAL INTEGRATION, SHARED RUNTIME OR PRODUCTION INTEROPERABILITY IS IMPLIED</text>
<text x="800" y="964" text-anchor="middle" class="domain">EVIDENCE · AUTHORITY · VERIFICATION · CONTROLLED EXECUTION</text>
</svg>