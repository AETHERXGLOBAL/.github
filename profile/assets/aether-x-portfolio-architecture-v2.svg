<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
<title id="title">AETHER X GLOBAL Portfolio and Research Architecture</title>
<desc id="desc">Portfolio overview for AETHER X Quantum, AX-OS, AETHER Intelligence Core and the AETHER X Research institutional unit. Connections show portfolio membership and shared doctrine only, not technical integration.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/>
    <stop offset="0.55" stop-color="#0b1424"/>
    <stop offset="1" stop-color="#050b14"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111d2f"/>
    <stop offset="1" stop-color="#0b1422"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9f7935"/>
    <stop offset="0.5" stop-color="#d7b56e"/>
    <stop offset="1" stop-color="#9f7935"/>
  </linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#8fa0b5" stroke-opacity="0.045"/>
  </pattern>
  <style>
    .brand{font:700 20px Inter,Segoe UI,Arial,sans-serif;letter-spacing:5px;fill:#d7b56e}
    .title{font:700 32px Inter,Segoe UI,Arial,sans-serif;fill:#f4f7fb}
    .subtitle{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#aeb9c8}
    .cardTitle{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#f6f8fb}
    .domain{font:600 15px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.2px;fill:#c9a86a}
    .pill{font:700 13px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.75px;fill:#f1d79a}
    .pillBlue{font:700 13px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.75px;fill:#d9e9ff}
    .pillPurple{font:700 13px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.75px;fill:#e6cff8}
    .principle{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1px;fill:#e7edf5}
    .principleSub{font:400 11px Inter,Segoe UI,Arial,sans-serif;fill:#8493a6}
  </style>
</defs>

<rect width="1600" height="850" fill="url(#bg)"/>
<rect width="1600" height="850" fill="url(#grid)"/>
<circle cx="800" cy="455" r="355" fill="none" stroke="#c9a86a" stroke-opacity="0.052"/>
<circle cx="800" cy="455" r="292" fill="none" stroke="#c9a86a" stroke-opacity="0.038"/>

<!-- Header -->
<text x="800" y="58" text-anchor="middle" class="brand">AETHER X GLOBAL</text>
<text x="800" y="108" text-anchor="middle" class="title">GOVERNED INTELLIGENCE SYSTEMS</text>
<text x="800" y="141" text-anchor="middle" class="subtitle">Three system initiatives. One institutional research unit. Shared doctrine. Explicit maturity.</text>
<rect x="650" y="166" width="300" height="2" fill="url(#gold)"/>
<circle cx="800" cy="194" r="6" fill="#d7b56e"/>

<!-- Portfolio membership connectors -->
