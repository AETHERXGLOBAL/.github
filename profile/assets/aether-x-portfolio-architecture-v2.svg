<circle cx="375" cy="285" r="5" fill="#d7b56e"/>
<circle cx="1225" cy="285" r="5" fill="#d7b56e"/>
<circle cx="375" cy="575" r="5" fill="#d7b56e"/>
<circle cx="1225" cy="575" r="5" fill="#d7b56e"/>

