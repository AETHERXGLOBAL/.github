name: Update public GitHub activity dashboard

on:
  pull_request:
    branches:
      - main
    paths:
      - "profile/scripts/render_engineering_pulse.py"
      - "profile/assets/aether-x-engineering-pulse.svg"
      - ".github/workflows/update-engineering-pulse.yml"
      - "profile/tests/test_public_git_activity.py"
      - "profile/tests/test_review_pr_lifecycle.py"
      - "profile/tests/test_workflow_dispatch_guard.py"
      - "profile/scripts/review_pr_lifecycle.sh"
  push:
    branches:
      - main
    paths:
      - "profile/scripts/render_engineering_pulse.py"
      - ".github/workflows/update-engineering-pulse.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: public-github-activity-dashboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline public dashboard regression tests
        run: |
          python3 -m py_compile profile/scripts/render_engineering_pulse.py
          python3 -m unittest discover -s profile/tests -p 'test_public_git_activity.py' -v
          python3 -m unittest discover -s profile/tests -p 'test_review_pr_lifecycle.py' -v
          python3 -m unittest discover -s profile/tests -p 'test_workflow_dispatch_guard.py' -v

  # F05: privileged refresh is only eligible on main-bound GitHub events.
  # Manual branch-selectable dispatch is intentionally absent (F05).
  refresh:
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public profile without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select review-only refresh branch
        run: bash profile/scripts/review_pr_lifecycle.sh prepare engineering

      - name: Validate renderer syntax
        run: |
          set -euo pipefail
          python3 -m py_compile profile/scripts/render_engineering_pulse.py

      - name: Render public GitHub activity dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 profile/scripts/render_engineering_pulse.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("profile/assets/aether-x-engineering-pulse.svg")
          print("SVG_XML_VALID")
          PY

      - name: Propose or recover review PR for outstanding public changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash profile/scripts/review_pr_lifecycle.sh publish engineering
