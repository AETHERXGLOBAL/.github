name: Update public GitHub activity dashboard

on:
  pull_request:
    branches:
      - main
    paths:
      - "profile/scripts/render_engineering_pulse.py"
      - "profile/assets/aether-x-engineering-pulse.svg"
      - ".github/workflows/update-engineering-pulse.yml"
      - "profile/tests/test_public_git_activity.py"
  push:
    branches:
      - main
    paths:
      - "profile/scripts/render_engineering_pulse.py"
      - ".github/workflows/update-engineering-pulse.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-github-activity-dashboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline public dashboard regression tests
        run: |
          python3 -m py_compile profile/scripts/render_engineering_pulse.py
          python3 -m unittest discover -s profile/tests -p 'test_public_git_activity.py' -v

  refresh:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Clone organization profile repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="main"
          git clone --depth 1 --branch "${BRANCH}" "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Select review-only refresh branch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cd repo
          BRANCH="automation/public-github-activity-review"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" FETCH_HEAD
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" merge --no-edit origin/main
          else
            git switch -C "$BRANCH" origin/main
          fi

      - name: Validate renderer syntax
        run: |
          set -euo pipefail
          cd repo
          python3 -m py_compile profile/scripts/render_engineering_pulse.py

      - name: Render public GitHub activity dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd repo
          python3 profile/scripts/render_engineering_pulse.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("profile/assets/aether-x-engineering-pulse.svg")
          print("SVG_XML_VALID")
          PY

      - name: Propose changed dashboard for protected-branch review
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd repo
          FILE="profile/assets/aether-x-engineering-pulse.svg"
          BRANCH="automation/public-github-activity-review"
          if git diff --quiet -- "$FILE"; then
            echo "No changed public activity; no review update needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$FILE"
          git commit -m "chore(profile): propose reviewed public GitHub activity update"
          git push origin "HEAD:refs/heads/$BRANCH"
          if ! gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty' | grep -q '[0-9]'; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "[REVIEW] Refresh public GitHub activity dashboard" \
              --body "Generated public-only activity telemetry. Requires human review and normal branch-protection checks before merge. No automatic publication or bypass."
          fi
