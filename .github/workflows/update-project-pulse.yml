name: Update AETHER X Live Portfolio Pulse

on:
  pull_request:
    branches:
      - main
    paths:
      - "profile/scripts/render_project_pulse.py"
      - "profile/scripts/sanitize_project_pulse.py"
      - ".github/workflows/update-project-pulse.yml"
      - "profile/tests/test_portfolio_pulse.py"
      - "profile/tests/test_review_pr_lifecycle.py"
      - "profile/tests/test_workflow_dispatch_guard.py"
      - "profile/scripts/review_pr_lifecycle.sh"
  push:
    branches:
      - main
    paths:
      - "profile/scripts/render_project_pulse.py"
      - "profile/scripts/sanitize_project_pulse.py"
      - ".github/workflows/update-project-pulse.yml"
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types:
      - project_state_changed

permissions:
  contents: read

concurrency:
  group: aether-x-live-portfolio-pulse
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline governed portfolio regression tests
        run: |
          python3 -m py_compile profile/scripts/render_project_pulse.py profile/scripts/sanitize_project_pulse.py
          python3 -m unittest discover -s profile/tests -p 'test_portfolio_pulse.py' -v
          python3 -m unittest discover -s profile/tests -p 'test_review_pr_lifecycle.py' -v
          python3 -m unittest discover -s profile/tests -p 'test_workflow_dispatch_guard.py' -v

  # F05: privileged refresh is only eligible on main-bound GitHub events.
  # Manual branch-selectable dispatch is intentionally absent (F05).
  refresh:
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch') &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select review-only portfolio refresh branch
        run: bash profile/scripts/review_pr_lifecycle.sh prepare portfolio

      - name: Validate publication scripts
        run: |
          python3 -m py_compile profile/scripts/render_project_pulse.py
          python3 -m py_compile profile/scripts/sanitize_project_pulse.py

      - name: Render governed portfolio telemetry
        env:
          PROJECT_PULSE_READ_TOKEN: ${{ secrets.PROJECT_PULSE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 profile/scripts/render_project_pulse.py

      - name: Apply public-safe presentation policy
        run: |
          set -euo pipefail
          python3 profile/scripts/sanitize_project_pulse.py

      - name: Validate generated SVG and disclosure boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("profile/assets/aether-x-live-project-pulse.svg")
          ET.parse(path)
          text = path.read_text(encoding="utf-8")
          forbidden = [
              r"github_pat_[A-Za-z0-9_]+",
              r"ghp_[A-Za-z0-9]+",
              r"Bearer\s+[A-Za-z0-9_.-]+",
              r"Do not start T\d+",
              r"Last verified refresh:",
              r"AMII RESEARCH LAB",
              r"amii-research-lab",
              r"LIVE PROJECT PULSE",
          ]
          for pattern in forbidden:
              if re.search(pattern, text, re.IGNORECASE):
                  raise SystemExit(f"PUBLIC_OUTPUT_POLICY_FAIL: forbidden pattern {pattern}")
          required = [
              "AETHER X Live Portfolio Pulse",
              "LIVE PORTFOLIO PULSE",
              "Last published state update:",
              "AETHER X RESEARCH",
              "INSTITUTIONAL RESEARCH UNIT · ACTIVE",
              "RESEARCH ≠ PRODUCTION",
              "PUBLIC DISCLOSURE REQUIRES APPROVAL",
          ]
          for value in required:
              if value not in text:
                  raise SystemExit(f"PUBLIC_OUTPUT_POLICY_FAIL: missing required marker {value}")
          print("PORTFOLIO_PULSE_SVG_VALID")
          PY

      - name: Preserve prior published timestamp when governed state is unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          path = Path("profile/assets/aether-x-live-project-pulse.svg")
          new = path.read_text(encoding="utf-8")
          try:
              old = subprocess.check_output(
                  ["git", "show", f"HEAD:{path.as_posix()}"],
                  text=True,
                  stderr=subprocess.DEVNULL,
              )
          except subprocess.CalledProcessError:
              print("PORTFOLIO_PULSE_FIRST_PUBLICATION")
              raise SystemExit(0)

          def semantic(value: str) -> str:
              value = re.sub(
                  r"Last published state update:\s*[^<]+",
                  "Last published state update: <normalized>",
                  value,
              )
              value = re.sub(
                  r"Last verified refresh:\s*[^<]+",
                  "Last published state update: <normalized>",
                  value,
              )
              return value

          if semantic(new) == semantic(old):
              path.write_text(old, encoding="utf-8")
              print("PORTFOLIO_PULSE_STATE_UNCHANGED")
          else:
              print("PORTFOLIO_PULSE_STATE_CHANGED")
          PY

      - name: Propose or recover review PR for governed state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash profile/scripts/review_pr_lifecycle.sh publish portfolio
