name: Update AETHER X Live Project Pulse

on:
  push:
    branches:
      - main
    paths:
      - "profile/scripts/render_project_pulse.py"
      - "profile/scripts/sanitize_project_pulse.py"
      - ".github/workflows/update-project-pulse.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - project_state_changed

permissions:
  contents: write

concurrency:
  group: aether-x-live-project-pulse
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate publication scripts
        run: |
          python3 -m py_compile profile/scripts/render_project_pulse.py
          python3 -m py_compile profile/scripts/sanitize_project_pulse.py

      - name: Render governed project telemetry
        env:
          PROJECT_PULSE_READ_TOKEN: ${{ secrets.PROJECT_PULSE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 profile/scripts/render_project_pulse.py

      - name: Apply public-safe presentation policy
        run: |
          set -euo pipefail
          python3 profile/scripts/sanitize_project_pulse.py

      - name: Validate generated SVG and disclosure boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("profile/assets/aether-x-live-project-pulse.svg")
          ET.parse(path)
          text = path.read_text(encoding="utf-8")
          forbidden = [
              r"github_pat_[A-Za-z0-9_]+",
              r"ghp_[A-Za-z0-9]+",
              r"Bearer\s+[A-Za-z0-9_.-]+",
              r"Do not start T\d+",
              r"Last verified refresh:",
          ]
          for pattern in forbidden:
              if re.search(pattern, text):
                  raise SystemExit(f"PUBLIC_OUTPUT_POLICY_FAIL: forbidden pattern {pattern}")
          required = [
              "Last published state update:",
              "COMMIT ≠ PROGRESS",
              "RESEARCH ≠ PRODUCTION",
          ]
          for value in required:
              if value not in text:
                  raise SystemExit(f"PUBLIC_OUTPUT_POLICY_FAIL: missing required marker {value}")
          print("PROJECT_PULSE_SVG_VALID")
          PY

      - name: Preserve prior published timestamp when governed state is unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          path = Path("profile/assets/aether-x-live-project-pulse.svg")
          new = path.read_text(encoding="utf-8")
          try:
              old = subprocess.check_output(
                  ["git", "show", f"HEAD:{path.as_posix()}"],
                  text=True,
                  stderr=subprocess.DEVNULL,
              )
          except subprocess.CalledProcessError:
              print("PROJECT_PULSE_FIRST_PUBLICATION")
              raise SystemExit(0)

          def semantic(value: str) -> str:
              value = re.sub(
                  r"Last published state update:\s*[^<]+",
                  "Last published state update: <normalized>",
                  value,
              )
              # One-time compatibility with the pre-refinement asset.
              value = re.sub(
                  r"Last verified refresh:\s*[^<]+",
                  "Last published state update: <normalized>",
                  value,
              )
              return value

          if semantic(new) == semantic(old):
              path.write_text(old, encoding="utf-8")
              print("PROJECT_PULSE_STATE_UNCHANGED")
          else:
              print("PROJECT_PULSE_STATE_CHANGED")
          PY

      - name: Publish only when governed public state changed
        run: |
          set -euo pipefail
          PULSE="profile/assets/aether-x-live-project-pulse.svg"
          if [[ -z "$(git status --porcelain -- "$PULSE")" ]]; then
            echo "No governed public-state change; no commit required."
            exit 0
          fi

          git config user.name "AETHER X Project Pulse"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PULSE"
          git commit -m "chore(profile): refresh live project pulse"
          git pull --rebase origin main
          git push origin HEAD:main
